<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FFFCF6" />
  <title>旅途 Wander｜點對點交通規劃</title>
  <style>
    :root {
      --paper: #FFFCF6;
      --paper-deep: #F5EFE4;
      --ink: #3E3A39;
      --muted: #81796F;
      --line: #D8D0C4;
      --green: #6B9A7C;
      --green-deep: #587B64;
      --green-pale: #E8EEE6;
      --orange: #C78A65;
      --white: #FFFFFF;
      --shadow: 0 14px 40px rgba(62, 58, 57, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 5%, rgba(232,238,230,.8), transparent 27rem),
        var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC",
        "Microsoft JhengHei", sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(100% - 32px, 760px); margin: 34px auto 56px; }
    .app {
      overflow: hidden;
      border: 2px solid var(--ink);
      border-radius: 28px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    header {
      padding: 22px 26px 20px;
      background: var(--paper-deep);
      border-bottom: 1px solid var(--line);
    }
    .topline, .eyebrow, .section-heading, .footerline {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: .02em; }
    .brand-mark {
      display: grid; place-items: center; width: 34px; height: 34px;
      border: 1.5px solid var(--ink); border-radius: 11px; background: var(--paper);
    }
    .pill {
      padding: 6px 11px; border-radius: 999px; background: #E4EDE3;
      color: var(--green-deep); font-size: 12px; font-weight: 700;
    }
    .eyebrow { margin-top: 17px; color: var(--muted); font-size: 11px; letter-spacing: .14em; }
    main { padding: 27px 26px 25px; }
    h1 { margin: 0 0 7px; font-size: clamp(27px, 5vw, 36px); letter-spacing: -.04em; }
    .intro { margin: 0 0 24px; color: var(--muted); font-size: 14px; line-height: 1.75; }
    .field-card {
      padding: 18px; border: 1px solid var(--line); border-radius: 19px; background: var(--white);
    }
    .field-label { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .06em; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
    .dot.end { background: var(--orange); }
    .field-row { display: flex; gap: 9px; align-items: center; }
    select, input {
      width: 100%; min-width: 0; height: 47px; padding: 0 13px;
      border: 1px solid var(--line); border-radius: 11px; outline: none;
      color: var(--ink); background: #FFFEFC;
    }
    select:focus, input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(107,154,124,.13); }
    .custom-input { margin-top: 9px; }
    .swap-wrap { display: flex; justify-content: center; margin: 12px 0; }
    .swap {
      display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px;
      border: 1px solid var(--line); border-radius: 999px; color: var(--ink);
      background: var(--paper-deep); font-size: 12px; font-weight: 700;
      transition: .18s ease;
    }
    .swap:hover { transform: translateY(-1px); border-color: var(--green); }
    .section { margin-top: 24px; }
    .section-heading { margin-bottom: 11px; }
    .section-heading h2 { margin: 0; font-size: 16px; }
    .section-heading span { color: var(--muted); font-size: 10px; letter-spacing: .12em; }
    .modes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .mode {
      min-height: 93px; display: flex; flex-direction: column; align-items: flex-start;
      justify-content: space-between; gap: 9px; padding: 13px 14px;
      border: 1px solid var(--line); border-radius: 15px; background: var(--white);
      color: var(--ink); text-align: left; transition: .18s ease;
    }
    .mode:hover { transform: translateY(-1px); border-color: #A9BBA9; }
    .mode[aria-pressed="true"] { border: 2px solid var(--green); padding: 12px 13px; background: var(--green-pale); }

    .sketch-icon {
      width: 29px; height: 29px; display: block; overflow: visible;
      fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
      filter: drop-shadow(.35px .35px 0 rgba(62,58,57,.16));
    }
    .pin-sketch {
      width: 22px; height: 27px; display: inline-block; vertical-align: middle;
      fill: none; stroke: currentColor; stroke-width: 1.7;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .mode-icon { display: inline-flex; align-items: center; justify-content: center; color: #5B6258; }
    .place-icon { color: #6B806E; }

    .mode-top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    .mode-icon { font-size: 23px; line-height: 1; }
    .check { color: var(--green-deep); font-weight: 900; opacity: 0; }
    .mode[aria-pressed="true"] .check { opacity: 1; }
    .mode strong { display: block; font-size: 14px; }
    .mode small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .preview {
      margin-top: 22px; padding: 16px; border-radius: 16px; background: #F3EEE5;
    }
    .preview-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 17px; font-size: 14px; font-weight: 800; }
    .selected { color: var(--green-deep); background: #E4EDE3; border-radius: 999px; padding: 5px 9px; font-size: 10px; }
    .route { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 10px; }
    .place { min-width: 0; text-align: center; }
    .place-icon { display: block; margin-bottom: 6px; font-size: 21px; }
    .place-name { overflow-wrap: anywhere; font-size: 13px; font-weight: 750; }
    .route-arrow { text-align: center; color: #958A7D; }
    .route-arrow span { display: block; margin-top: 4px; white-space: nowrap; font-size: 10px; }
    .hint { margin: 15px 0 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .actions { display: grid; grid-template-columns: 1fr auto; gap: 9px; margin-top: 16px; }
    .primary, .reset {
      min-height: 49px; border-radius: 12px; font-weight: 800; transition: .18s ease;
    }
    .primary { border: 1px solid var(--green-deep); color: white; background: var(--green-deep); padding: 0 17px; }
    .primary:hover { background: #496B55; transform: translateY(-1px); }
    .reset { padding: 0 15px; border: 1px solid var(--line); color: var(--ink); background: transparent; }
    .reset:hover { background: var(--paper-deep); }
    .tips { margin-top: 23px; padding-top: 18px; border-top: 1px solid var(--line); }
    .tips h2 { margin: 0 0 11px; font-size: 14px; }
    .tip { display: flex; gap: 9px; margin: 9px 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .tip b { color: var(--green-deep); }
    footer { padding: 15px 20px; background: var(--paper-deep); text-align: center; color: var(--muted); font-size: 10px; letter-spacing: .12em; }
    .toast {
      position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px);
      padding: 11px 16px; border-radius: 999px; color: white; background: var(--ink);
      font-size: 13px; opacity: 0; pointer-events: none; transition: .2s ease;
      box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 520px) {
      .shell { width: min(100% - 18px, 760px); margin: 10px auto 24px; }
      .app { border-radius: 22px; }
      header { padding: 18px 18px 16px; }
      main { padding: 23px 17px 20px; }
      .field-card { padding: 14px; }
      .actions { grid-template-columns: 1fr; }
      .reset { min-height: 43px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="app">
      <header>
        <div class="topline">
          <div class="brand"><span class="brand-mark">⌖</span> 旅途 Wander</div>
          <span class="pill">交通規劃</span>
        </div>
        <div class="eyebrow"><span>TRAVEL / TRANSPORTATION</span><span>JAPAN 2026</span></div>
      </header>

      <main>
        <h1>去哪裡？</h1>
        <p class="intro">選擇兩個地點，讓我們幫你找到合適的交通方式。</p>

        <section class="field-card" aria-label="選擇起點與終點">
          <label class="field-label" for="originSelect"><span class="dot"></span> FROM / 出發地</label>
          <div class="field-row">
            <select id="originSelect">
              <option>淺草寺</option><option>東京晴空塔</option><option>東京車站</option>
              <option>上野公園</option><option>六本木</option><option>池袋</option>
              <option>新宿</option><option>澀谷</option><option>台場</option><option>成田機場</option>
            </select>
          </div>
          <input class="custom-input" id="originCustom" type="text" placeholder="或輸入其他出發地（選填）" />

          <div class="swap-wrap">
            <button class="swap" id="swapBtn" type="button" aria-label="交換起點與終點">↕ 交換起終點</button>
          </div>

          <label class="field-label" for="destinationSelect"><span class="dot end"></span> TO / 目的地</label>
          <select id="destinationSelect">
            <option>東京晴空塔</option><option>淺草寺</option><option>東京車站</option>
            <option>上野公園</option><option>六本木</option><option>池袋</option>
            <option>新宿</option><option>澀谷</option><option>台場</option><option>成田機場</option>
          </select>
          <input class="custom-input" id="destinationCustom" type="text" placeholder="或輸入其他目的地（選填）" />
        </section>

        <section class="section">
          <div class="section-heading"><h2>選擇交通方式</h2><span>TRANSPORT</span></div>
          <div class="modes" id="modes">
            <button class="mode" type="button" data-mode="transit" aria-pressed="true">
              <span class="mode-top"><span class="mode-icon"><svg class="sketch-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M13 33V14c0-4 2-6 6-6h10c4 0 6 2 6 6v19c0 3-2 5-6 5H19c-4 0-6-2-6-5Z"/><path d="M14 23h20M18 14h12M18 30h1m10 0h1M19 38l-4 5m14-5 4 5"/></svg></span><span class="check">✓</span></span>
              <span><strong>大眾運輸</strong><small>電車・地鐵・巴士</small></span>
            </button>
            <button class="mode" type="button" data-mode="driving" aria-pressed="false">
              <span class="mode-top"><span class="mode-icon"><svg class="sketch-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="m8 27 3-8c1-2 2-3 5-3h16c3 0 4 1 5 3l3 8v10H8V27Z"/><path d="M12 25h24l-3-7H15l-3 7Zm-4 5h6m20 0h6"/><circle cx="15" cy="31" r="2.5"/><circle cx="33" cy="31" r="2.5"/></svg></span><span class="check">✓</span></span>
              <span><strong>開車</strong><small>汽車路線</small></span>
            </button>
            <button class="mode" type="button" data-mode="walking" aria-pressed="false">
              <span class="mode-top"><span class="mode-icon"><svg class="sketch-icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="27" cy="8" r="4"/><path d="m24 16 7 6 7 1m-14-7-6 10-7 4m13-14-1 12 8 7m-8-7-7 12m15-5 7 7"/></svg></span><span class="check">✓</span></span>
              <span><strong>步行</strong><small>步行路線</small></span>
            </button>
            <button class="mode" type="button" data-mode="bicycling" aria-pressed="false">
              <span class="mode-top"><span class="mode-icon"><svg class="sketch-icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="11" cy="32" r="8"/><circle cx="37" cy="32" r="8"/><path d="m11 32 8-15 10 15H11l8-15h9m-1-5h7m-3 0 6 0"/></svg></span><span class="check">✓</span></span>
              <span><strong>自行車</strong><small>單車路線</small></span>
            </button>
          </div>
        </section>

        <section class="preview" aria-live="polite">
          <div class="preview-title"><span>路線預覽</span><span class="selected">已選擇</span></div>
          <div class="route">
            <div class="place"><span class="place-icon"><svg class="pin-sketch" viewBox="0 0 28 34" aria-hidden="true"><path d="M14 31S3 19 3 12a11 11 0 0 1 22 0c0 7-11 19-11 19Z"/><circle cx="14" cy="12" r="3.5"/></svg></span><div class="place-name" id="fromPreview">淺草寺</div></div>
            <div class="route-arrow">⟶<span id="modePreview">大眾運輸</span></div>
            <div class="place"><span class="place-icon"><svg class="pin-sketch" viewBox="0 0 28 34" aria-hidden="true"><path d="M14 31S3 19 3 12a11 11 0 0 1 22 0c0 7-11 19-11 19Z"/><circle cx="14" cy="12" r="3.5"/></svg></span><div class="place-name" id="toPreview">東京晴空塔</div></div>
          </div>
          <p class="hint">實際路線、班次、轉乘資訊與所需時間，將由 Google Maps 提供。</p>
        </section>

        <div class="actions">
          <button class="primary" id="openMaps" type="button">↗ 使用 Google Maps 規劃路線</button>
          <button class="reset" id="resetBtn" type="button">重設</button>
        </div>

        <section class="tips">
          <h2>使用小提醒</h2>
          <div class="tip"><b>ⓘ</b><span>開啟 Google Maps 後，可以查看實際路線、轉乘站及出發時間。</span></div>
          <div class="tip"><b>⌖</b><span>可以從下拉選單選擇常用景點，也可以自行輸入其他地點名稱或地址。</span></div>
        </section>
      </main>
      <footer>旅途 WANDER · MAKE EVERY TRIP EASIER</footer>
    </div>
  </div>
  <div class="toast" id="toast" role="status">請先輸入出發地與目的地</div>

  <script>
    const originSelect = document.getElementById('originSelect');
    const destinationSelect = document.getElementById('destinationSelect');
    const originCustom = document.getElementById('originCustom');
    const destinationCustom = document.getElementById('destinationCustom');
    const fromPreview = document.getElementById('fromPreview');
    const toPreview = document.getElementById('toPreview');
    const modePreview = document.getElementById('modePreview');
    const modeNames = {
      transit: '大眾運輸',
      driving: '開車',
      walking: '步行',
      bicycling: '自行車'
    };
    let selectedMode = 'transit';

    function getOrigin() {
      return originCustom.value.trim() || originSelect.value;
    }
    function getDestination() {
      return destinationCustom.value.trim() || destinationSelect.value;
    }
    function updatePreview() {
      fromPreview.textContent = getOrigin();
      toPreview.textContent = getDestination();
      modePreview.textContent = modeNames[selectedMode];
    }
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2300);
    }

    document.querySelectorAll('.mode').forEach(button => {
      button.addEventListener('click', () => {
        selectedMode = button.dataset.mode;
        document.querySelectorAll('.mode').forEach(item => {
          item.setAttribute('aria-pressed', String(item === button));
        });
        updatePreview();
      });
    });

    [originSelect, destinationSelect, originCustom, destinationCustom].forEach(el => {
      el.addEventListener('input', updatePreview);
      el.addEventListener('change', updatePreview);
    });

    document.getElementById('swapBtn').addEventListener('click', () => {
      const currentOrigin = getOrigin();
      const currentDestination = getDestination();
      const originIsCustom = !!originCustom.value.trim();
      const destinationIsCustom = !!destinationCustom.value.trim();

      if (destinationIsCustom) {
        originCustom.value = currentDestination;
      } else {
        originCustom.value = '';
        originSelect.value = currentDestination;
      }
      if (originIsCustom) {
        destinationCustom.value = currentOrigin;
      } else {
        destinationCustom.value = '';
        destinationSelect.value = currentOrigin;
      }
      updatePreview();
    });

    document.getElementById('openMaps').addEventListener('click', () => {
      const origin = getOrigin();
      const destination = getDestination();
      if (!origin || !destination) {
        showToast('請先輸入出發地與目的地');
        return;
      }
      if (origin === destination) {
        showToast('出發地與目的地不能相同');
        return;
      }
      const params = new URLSearchParams({
        api: '1',
        origin,
        destination,
        travelmode: selectedMode
      });
      const url = `https://www.google.com/maps/dir/?${params.toString()}`;
      window.open(url, '_blank', 'noopener,noreferrer');
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      originSelect.value = '淺草寺';
      destinationSelect.value = '東京晴空塔';
      originCustom.value = '';
      destinationCustom.value = '';
      selectedMode = 'transit';
      document.querySelectorAll('.mode').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.mode === selectedMode));
      });
      updatePreview();
    });

    updatePreview();
  </script>
</body>
</html>
